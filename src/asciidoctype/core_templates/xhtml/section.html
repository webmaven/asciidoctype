<section class="${'adoc-section level-' + str(node.get('level', 0))}" 
         tal:attributes="id node.get('attributes', {}).get('id')">
    <tal:block tal:define="hlevel node.get('level', 0) + 1">
        <h1 tal:condition="hlevel == 1"><tal:block tal:repeat="t node.get('title', [])" tal:replace="structure renderer.render(t, ctx)" /></h1>
        <h2 tal:condition="hlevel == 2"><tal:block tal:repeat="t node.get('title', [])" tal:replace="structure renderer.render(t, ctx)" /></h2>
        <h3 tal:condition="hlevel == 3"><tal:block tal:repeat="t node.get('title', [])" tal:replace="structure renderer.render(t, ctx)" /></h3>
        <h4 tal:condition="hlevel == 4"><tal:block tal:repeat="t node.get('title', [])" tal:replace="structure renderer.render(t, ctx)" /></h4>
        <h5 tal:condition="hlevel == 5"><tal:block tal:repeat="t node.get('title', [])" tal:replace="structure renderer.render(t, ctx)" /></h5>
        <h6 tal:condition="hlevel >= 6"><tal:block tal:repeat="t node.get('title', [])" tal:replace="structure renderer.render(t, ctx)" /></h6>
    </tal:block>
    
    <div class="section-blocks">
        <tal:block tal:repeat="block node.get('blocks', [])" 
                   tal:replace="structure renderer.render(block, ctx)" />
    </div>
</section>
