<tal:block tal:define="variant node.get('variant', 'asciimath');
                       val node.get('value', '')">
    <div class="stemblock" tal:attributes="id node.get('attributes', {}).get('id')">
        <div tal:condition="node.get('title')" class="title">
            <tal:block tal:repeat="inline node.get('title', [])" tal:replace="structure renderer.render(inline, ctx)" />
        </div>
        <div class="content">
            <tal:block tal:condition="python:variant in ('latex', 'latexmath')"
                       tal:replace="structure python:__import__('latex2mathml.converter').converter.convert(val)" />
            <tal:block tal:condition="python:variant not in ('latex', 'latexmath')"
                       tal:content="val" />
        </div>
    </div>
</tal:block>
