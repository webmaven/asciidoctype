<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title tal:content="node.get('header', {}).get('title') or 'Document'"></title>
</head>
<body>
    <div id="header" tal:condition="node.get('header', {}).get('title')">
        <h1 tal:content="node.get('header', {}).get('title')"></h1>
    </div>
    <div id="content">
        <tal:block tal:repeat="block node.get('blocks', [])"
                   tal:replace="structure renderer.render(block, ctx)" />
    </div>
</body>
</html>
