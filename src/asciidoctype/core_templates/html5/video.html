<tal:block tal:define="role node.get('attributes', {}).get('role');
                       video_class python:('videoblock' + (' ' + role if role else '')).strip()">
    <div tal:attributes="id node.get('attributes', {}).get('id'); class video_class">
        <div tal:condition="node.get('title')" class="title">
            <tal:block tal:repeat="inline node.get('title', [])" tal:replace="structure renderer.render(inline, ctx)" />
        </div>
        <div class="content">
            <video tal:attributes="src node.get('target', '');
                                   width node.get('attributes', {}).get('width');
                                   height node.get('attributes', {}).get('height');
                                   autoplay node.get('attributes', {}).get('autoplay');
                                   controls python:'controls' if node.get('attributes', {}).get('controls', True) else None;
                                   loop node.get('attributes', {}).get('loop')">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>
</tal:block>
