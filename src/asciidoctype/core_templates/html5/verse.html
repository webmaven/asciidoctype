<tal:block tal:define="role node.get('attributes', {}).get('role');
                       verse_class python:('verseblock' + (' ' + role if role else '')).strip()">
    <div tal:attributes="id node.get('attributes', {}).get('id'); class verse_class">
        <div tal:condition="node.get('title')" class="title">
            <tal:block tal:repeat="inline node.get('title', [])" tal:replace="structure renderer.render(inline, ctx)" />
        </div>
        <pre class="content"><tal:block tal:repeat="block node.get('blocks', [])" tal:replace="structure renderer.render(block, ctx)" /></pre>
        <div tal:condition="node.get('attribution')" class="attribution">&#8212; <tal:block tal:repeat="inline node.get('attribution', [])" tal:replace="structure renderer.render(inline, ctx)" /></div>
    </div>
</tal:block>
