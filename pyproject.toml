[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asciidoctype"
version = "0.1.0a2"
description = "A headless, pure-Python HTML5 and XHTML rendering library for AsciiDoctrine ASG dictionaries."

readme = {file = "README.adoc", content-type = "text/plain"}
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "chameleon>=4.0.0",
    "asciidoctrine>=0.2.0a1",
    "latex2mathml>=3.77.0",
]


[project.urls]
Homepage = "https://github.com/webmaven/asciidoctype"
Source = "https://github.com/webmaven/asciidoctype"
Issues = "https://github.com/webmaven/asciidoctype/issues"
Changelog = "https://github.com/webmaven/asciidoctype/blob/main/CHANGELOG.adoc"
Documentation = "https://github.com/webmaven/asciidoctype/blob/main/README.adoc"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asciidoctype = ["core_templates/*/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/asciidoctype"]

[tool.pytest.ini_options]
pythonpath = ["src"]



