repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ./.venv/bin/ruff check --quiet src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format check
        entry: ./.venv/bin/ruff format --check src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy typecheck
        entry: ./.venv/bin/mypy --no-error-summary src/asciidoctype
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest suite with coverage
        entry: ./.venv/bin/pytest -q --tb=short --cov=asciidoctype --cov-fail-under=95
        language: system
        types: [python]
        pass_filenames: false

