repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ./.venv/bin/ruff check --quiet src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy typecheck
        entry: ./.venv/bin/mypy --no-error-summary src/asciidoctype
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest suite
        entry: ./.venv/bin/pytest -q --tb=short
        language: system
        types: [python]
        pass_filenames: false
